# Rilis Jejak: membangun aplikasi desktop dan mengunggah ke GitHub Releases.
#
# Rahasia yang harus diisi pemilik (nama saja, tanpa nilai):
#   - TAURI_SIGNING_PRIVATE_KEY        (kunci privat minisign untuk penandatangan)
#   - TAURI_SIGNING_PRIVATE_KEY_PASSWORD (sandi kunci privat)
#   - ANDROID_KEYSTORE_BASE64          (keystore rilis APK, di-base64; opsional)
#   - ANDROID_KEYSTORE_PASSWORD        (sandi keystore APK)
#   - ANDROID_KEY_ALIAS                (alias kunci di keystore APK)
#   Bila ANDROID_KEYSTORE_BASE64 kosong, job APK dilewati (rilis desktop tetap jalan).
#   GITHUB_TOKEN disediakan otomatis oleh GitHub.
#   Bila TAURI_SIGNING_PRIVATE_KEY kosong, build native macOS dilewati.
#
# Cara memicu rilis:
#   bun run release 1.0.0        # naikkan versi, commit, dan tag v1.0.0
#   git push --follow-tags      # dorong commit dan tag; workflow ini berjalan
#   Rilis dibuat sebagai draf; pemilik memeriksa lalu menerbitkannya.
#
# Rilis beta dipicu dengan tag berprarelis, mis. v1.0.0-beta.1. Rilis beta
# memakai tag bergulir `beta` (rilis bukan draf, ditandai prarilis).
#
# Catatan: uji "pasang versi N-1 lalu perbarui ke N" BELUM otomatis ada di
# workflow ini (ditangguhkan). Uji manual sudah lulus di R4a. Tambahkan
# uji otomatis bila sudah ada runner untuk pemasangan aplikasi.
name: Rilis

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rilis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gerbang:
    name: Gerbang rilis
    runs-on: macos-latest
    outputs:
      channel: ${{ steps.kanal.outputs.channel }}
    steps:
      - name: Ambil kode
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Pasang Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Pasang dependensi
        run: bun install --frozen-lockfile

      - name: Periksa tipe
        run: bun run typecheck

      - name: Jalankan tes
        run: bun test

      # Tag rilis harus cocok dengan versi di manifest. Untuk pemicu manual
      # (`workflow_dispatch`) pemeriksaan tag dilewati bila ref yang dipilih
      # bukan tag versi.
      - name: Periksa versi dan tag
        if: startsWith(github.ref, 'refs/tags/')
        run: bun run check:version -- --tag "$GITHUB_REF_NAME"

      # Kanal rilis dibaca dari versi manifest: tanpa prarilis = stable,
      # dengan prarilis = beta.
      - name: Tentukan kanal rilis
        id: kanal
        run: echo "channel=$(bun run check:version -- --print-channel)" >> "$GITHUB_OUTPUT"

  bangun:
    name: Bangun ${{ matrix.triple }}
    needs: gerbang
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    # Windows masih beta: kegagalan di runner Windows tidak memblokir rilis.
    # Rencana perbaikan ada di R6.
    continue-on-error: ${{ matrix.beta }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            triple: aarch64-apple-darwin
            bundles: app,dmg
            binary: dist/jejak-darwin-arm64
            beta: false
          - os: macos-15-intel
            target: bun-darwin-x64
            triple: x86_64-apple-darwin
            bundles: app,dmg
            binary: dist/jejak-darwin-x64
            beta: false
          - os: windows-latest
            target: bun-windows-x64
            triple: x86_64-pc-windows-msvc
            bundles: nsis
            binary: dist/jejak-windows-x64.exe
            beta: true
    steps:
      - name: Ambil kode
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Pasang Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Pasang dependensi
        run: bun install --frozen-lockfile

      - name: Pasang toolchain Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.triple }}

      - name: Simpan cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Bangun binary sidecar
        run: bun run build:binary --target ${{ matrix.target }}

      - name: Tempatkan binary sidecar
        run: bun run stage:sidecar --target ${{ matrix.target }}

      # Skrip `smoke:binary` menerima path binary hasil build, jadi bisa
      # langsung diuji di sini. Di Windows kegagalan ditoleransi (beta).
      - name: Uji asap binary
        continue-on-error: ${{ matrix.beta }}
        run: bun run smoke:binary -- ${{ matrix.binary }}

      # Kanal stabil: rilis memakai tag versi dan dibuat sebagai draf supaya
      # pemilik memeriksa lalu menerbitkannya. `includeUpdaterJson` membuat
      # latest.json ikut terunggah untuk pembaruan aplikasi.
      - name: Unggah rilis stabil
        if: needs.gerbang.outputs.channel == 'stable'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Jejak ${{ github.ref_name }}
          prerelease: false
          releaseDraft: true
          includeUpdaterJson: true
          args: --target ${{ matrix.triple }} --bundles ${{ matrix.bundles }}

      # Kanal beta: tag bergulir `beta`, tanpa draf, ditandai prarilis.
      # latest.json ikut terunggah; aplikasi mengambil berkas itu dari
      # https://github.com/jejak-dev/jejak/releases/download/beta/latest.json
      - name: Unggah rilis beta
        if: needs.gerbang.outputs.channel == 'beta'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: beta
          releaseName: Jejak beta
          prerelease: true
          releaseDraft: false
          includeUpdaterJson: true
          args: --target ${{ matrix.triple }} --bundles ${{ matrix.bundles }}

  # Cangkang native macOS (AppKit + WKWebView): dibangun per arsitektur,
  # arsipnya diunggah ke rilis, lalu satu job menggabungkan potongan platform
  # `darwin-<arch>-native` ke latest.json (kunci Tauri tidak disentuh).
  # Dilewati bila TAURI_SIGNING_PRIVATE_KEY kosong.
  native-macos:
    name: Bangun native ${{ matrix.triple }}
    needs: [gerbang, bangun]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            triple: aarch64-apple-darwin
          - os: macos-15-intel
            target: bun-darwin-x64
            triple: x86_64-apple-darwin
    steps:
      - name: Periksa kunci penandatangan
        id: kunci
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::notice::TAURI_SIGNING_PRIVATE_KEY kosong, build native dilewati."
            echo "ada=false" >> "$GITHUB_OUTPUT"
          else
            echo "ada=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ambil kode
        if: steps.kunci.outputs.ada == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Pasang Bun 1.4.2
        if: steps.kunci.outputs.ada == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Pasang dependensi
        if: steps.kunci.outputs.ada == 'true'
        run: bun install --frozen-lockfile

      - name: Bangun dan tempatkan sidecar
        if: steps.kunci.outputs.ada == 'true'
        run: |
          bun run build:binary --target ${{ matrix.target }}
          bun run stage:sidecar --target ${{ matrix.target }}

      - name: Uji inti native
        if: steps.kunci.outputs.ada == 'true'
        run: |
          export SDKROOT="$(xcrun --show-sdk-path)"
          bash native/macos/scripts/build-core.sh test

      - name: Bangun Jejak.app native
        if: steps.kunci.outputs.ada == 'true'
        run: |
          export SDKROOT="$(xcrun --show-sdk-path)"
          JEJAK_SIDECAR="$PWD/src-tauri/binaries/jejak-${{ matrix.triple }}" bash native/macos/scripts/build-app.sh

      - name: Kemas, tanda tangani, dan unggah arsip native
        if: steps.kunci.outputs.ada == 'true'
        run: |
          if [ "${{ needs.gerbang.outputs.channel }}" = "beta" ]; then TAG=beta; else TAG="$GITHUB_REF_NAME"; fi
          VERSI="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' native/macos/build/Jejak.app/Contents/Info.plist)"
          ARCH="$(uname -m | sed 's/arm64/aarch64/')"
          NAMA="Jejak-native_${VERSI}_${ARCH}.app.tar.gz"
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$NAMA"
          bash native/macos/scripts/package-update.sh "$URL"
          OUT=native/macos/build/update
          mv "$OUT/Jejak_${VERSI}_${ARCH}.app.tar.gz" "$OUT/$NAMA"
          # Potongan memuat tanda tangan arsip; salin ke berkas bernama per arsitektur.
          cp "$OUT/platform-native.json" "$OUT/platform-native-${ARCH}.json"
          # Rilis draf tidak ditemukan lewat tag, jadi cari di daftar rilis.
          RID="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -1)"
          [ -n "$RID" ] || { echo "Rilis $TAG tidak ditemukan" >&2; exit 1; }
          for BERKAS in "$NAMA" "platform-native-${ARCH}.json"; do
            gh api "repos/$GITHUB_REPOSITORY/releases/$RID/assets" --jq ".[] | select(.name==\"$BERKAS\") | .id" |
              while read -r AID; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$AID"; done
            case "$BERKAS" in
              *.json) TIPE="application/json" ;;
              *) TIPE="application/gzip" ;;
            esac
            gh api -X POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RID/assets?name=$BERKAS" \
              -H "Content-Type: $TIPE" --input "$OUT/$BERKAS"
          done

  native-gabung:
    name: Gabungkan latest.json native
    needs: [gerbang, native-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - name: Ambil kode
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Gabungkan potongan ke latest.json
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        run: |
          if [ "${{ needs.gerbang.outputs.channel }}" = "beta" ]; then TAG=beta; else TAG="$GITHUB_REF_NAME"; fi
          RID="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -1)"
          [ -n "$RID" ] || { echo "Rilis $TAG tidak ditemukan" >&2; exit 1; }
          unduh() { # nama berkas -> isi (lewat API, berlaku untuk rilis draf)
            AID="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RID/assets" --jq ".[] | select(.name==\"$1\") | .id")"
            [ -n "$AID" ] || return 1
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$AID" > "$2"
          }
          mkdir -p kerja && cd kerja
          unduh latest.json latest.json || { echo "latest.json belum ada di rilis $TAG" >&2; exit 1; }
          POTONGAN=()
          for ARCH in aarch64 x86_64; do
            if unduh "platform-native-$ARCH.json" "p-$ARCH.json"; then POTONGAN+=("p-$ARCH.json"); fi
          done
          [ "${#POTONGAN[@]}" -ge 1 ] || { echo "tidak ada potongan native" >&2; exit 1; }
          bash ../native/macos/scripts/merge-latest.sh latest.json "${POTONGAN[@]}" > latest.baru.json
          AID="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RID/assets" --jq '.[] | select(.name=="latest.json") | .id')"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$AID"
          gh api -X POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RID/assets?name=latest.json" \
            -H "Content-Type: application/json" --input latest.baru.json
          jq -c '.platforms | keys' latest.baru.json

  # Cangkang native Windows (WPF + WebView2): folder aplikasi di-zip dan
  # dilampirkan ke rilis. Belum ada pembaru otomatis Windows, jadi latest.json
  # tidak disentuh. Beta: kegagalan tidak memblokir rilis.
  native-windows:
    name: Bangun native Windows
    needs: [gerbang, bangun]
    runs-on: windows-latest
    continue-on-error: true
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Ambil kode
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Pasang Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Pasang dependensi
        run: bun install --frozen-lockfile

      - name: Bangun dan tempatkan sidecar
        run: |
          bun run build:binary --target bun-windows-x64
          bun run stage:sidecar --target bun-windows-x64

      - name: Uji inti native
        run: dotnet run --project native/windows/tests/JejakShellCore.Tests -c Release

      - name: Bangun folder aplikasi
        shell: pwsh
        run: ./native/windows/scripts/build-app.ps1

      - name: Zip dan lampirkan ke rilis
        shell: bash
        run: |
          VERSI="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -1)"
          if [ "${{ needs.gerbang.outputs.channel }}" = "beta" ]; then TAG=beta; else TAG="$GITHUB_REF_NAME"; fi
          NAMA="Jejak-native_${VERSI}_x64-windows.zip"
          (cd native/windows/build && powershell -NoProfile -Command "Compress-Archive -Path Jejak -DestinationPath ../$NAMA -Force")
          RID="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -1)"
          [ -n "$RID" ] || { echo "Rilis $TAG tidak ditemukan" >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases/$RID/assets" --jq ".[] | select(.name==\"$NAMA\") | .id" |
            while read -r AID; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$AID"; done
          gh api -X POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RID/assets?name=$NAMA" \
            -H "Content-Type: application/zip" --input "native/windows/$NAMA"

  # Cangkang native Linux (GTK3 + WebKitGTK): .deb dan tar.gz per arsitektur
  # dilampirkan ke rilis. Belum ada pembaru otomatis Linux, jadi latest.json
  # tidak disentuh. Beta: kegagalan tidak memblokir rilis.
  native-linux:
    name: Bangun native ${{ matrix.arch }}
    needs: [gerbang, bangun]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            target: bun-linux-x64
          - os: ubuntu-24.04-arm
            arch: arm64
            target: bun-linux-arm64
    steps:
      - name: Ambil kode
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Pasang Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Pasang dependensi
        run: bun install --frozen-lockfile

      - name: Pasang pustaka GTK dan WebKitGTK
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Bangun sidecar
        run: bun run build:binary --target ${{ matrix.target }}

      - name: Uji inti native
        working-directory: native/linux
        run: cargo test --locked

      - name: Bangun jendela GTK
        working-directory: native/linux
        run: cargo build --release --locked --features ui

      - name: Kemas
        run: |
          SIDECAR="dist/jejak-linux-$([ '${{ matrix.arch }}' = amd64 ] && echo x64 || echo arm64)"
          bash native/linux/scripts/package.sh native/linux/target/release/Jejak "$SIDECAR" ${{ matrix.arch }}

      - name: Lampirkan ke rilis
        run: |
          if [ "${{ needs.gerbang.outputs.channel }}" = "beta" ]; then TAG=beta; else TAG="$GITHUB_REF_NAME"; fi
          RID="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -1)"
          [ -n "$RID" ] || { echo "Rilis $TAG tidak ditemukan" >&2; exit 1; }
          for BERKAS in native/linux/build/*.tar.gz native/linux/build/*.deb; do
            NAMA="$(basename "$BERKAS")"
            gh api "repos/$GITHUB_REPOSITORY/releases/$RID/assets" --jq ".[] | select(.name==\"$NAMA\") | .id" |
              while read -r AID; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$AID"; done
            gh api -X POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RID/assets?name=$NAMA" \
              -H "Content-Type: application/octet-stream" --input "$BERKAS"
          done

  # APK Android klien tipis (WebView ke server Jejak). Dibangun setelah rilis
  # desktop supaya rilis draf/beta dari tauri-action sudah ada untuk dilampiri.
  apk:
    name: Bangun APK Android
    needs: [gerbang, bangun]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      JEJAK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      JEJAK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - name: Periksa rahasia penandatanganan
        id: rahasia
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::notice::ANDROID_KEYSTORE_BASE64 kosong, APK dilewati."
            echo "ada=false" >> "$GITHUB_OUTPUT"
          else
            echo "ada=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ambil kode
        if: steps.rahasia.outputs.ada == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Siapkan SDK dan keystore
        if: steps.rahasia.outputs.ada == 'true'
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" "platforms;android-36" >/dev/null
          echo "ANDROID_BUILD_TOOLS=$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_ENV"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jejak-rilis.jks"
          echo "JEJAK_KEYSTORE=$RUNNER_TEMP/jejak-rilis.jks" >> "$GITHUB_ENV"

      - name: Bangun APK
        if: steps.rahasia.outputs.ada == 'true'
        run: bash android/build.sh

      - name: Lampirkan APK ke rilis
        if: steps.rahasia.outputs.ada == 'true'
        run: |
          VERSI="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -1)"
          if [ "${{ needs.gerbang.outputs.channel }}" = "beta" ]; then TAG=beta; else TAG="$GITHUB_REF_NAME"; fi
          NAMA="Jejak-${VERSI}.apk"
          cp android/build/jejak.apk "$NAMA"
          # Rilis draf tidak ditemukan lewat tag, jadi cari di daftar rilis.
          RID="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -1)"
          [ -n "$RID" ] || { echo "Rilis $TAG tidak ditemukan" >&2; exit 1; }
          # Hapus APK lama bernama sama (tag beta bergulir, atau jalan ulang).
          gh api "repos/$GITHUB_REPOSITORY/releases/$RID/assets" --jq '.[] | select(.name|test("^Jejak-.*\\.apk$")) | .id' |
            while read -r AID; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$AID"; done
          gh api -X POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RID/assets?name=$NAMA" \
            -H "Content-Type: application/vnd.android.package-archive" --input "$NAMA"
          echo "Terunggah: $NAMA ke rilis $TAG"
