# CI Jejak: pemeriksaan tipe, tes, konsistensi versi, dan tes/lint Rust.
#
# Tidak ada rahasia yang dipakai di workflow ini.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tes:
    name: Tes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows masih beta: kegagalan di runner Windows tidak memblokir PR.
    # Rencana perbaikan ada di R6.
    continue-on-error: ${{ matrix.beta }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            beta: false
          - os: windows-latest
            beta: true
    steps:
      - name: Ambil kode
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Pasang Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Pasang dependensi
        run: bun install --frozen-lockfile

      - name: Periksa tipe
        run: bun run typecheck

      - name: Jalankan tes
        run: bun test

      - name: Periksa versi manifest
        run: bun run check:version

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Pasang Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Pasang dependensi
        run: bun install --frozen-lockfile

      - name: Pasang Chromium untuk Playwright
        run: bunx playwright install --with-deps chromium

      # Server uji memakai runner mock dan JEJAK_HOME sementara.
      - name: Jalankan tes e2e
        run: bun run test:e2e

  rust:
    name: Rust (src-tauri)
    runs-on: macos-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Pasang toolchain Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Simpan cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      # `tauri_build` pada build.rs menyalin sidecar yang disebut di
      # `bundle.externalBin` (binaries/jejak-<triple>) dan build.rs gagal
      # bila berkas itu tidak ada. Untuk `cargo test` dan `cargo clippy`
      # isi sidecar tidak dipakai, jadi berkas kosong sudah cukup.
      - name: Sediakan sidecar kosong untuk build.rs
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/jejak-aarch64-apple-darwin
          touch src-tauri/binaries/jejak-x86_64-apple-darwin

      - name: Tes Rust
        run: cargo test
        working-directory: src-tauri

      - name: Lint Rust
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

  # Cangkang native Windows (WPF + WebView2): uji inti dan gerbang kompilasi.
  # Beta: kegagalan tidak memblokir PR sampai pernah terbukti hijau di runner.
  native-windows:
    name: Native Windows
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Ambil kode
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Uji inti
        run: dotnet run --project native/windows/tests/JejakShellCore.Tests -c Release

      - name: Bangun app WPF
        run: dotnet build native/windows/src/JejakDesktop -c Release

  # Cangkang native Linux (GTK3 + WebKitGTK): uji inti dan gerbang kompilasi jendela.
  native-linux:
    name: Native Linux
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Ambil kode
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Pasang pustaka GTK dan WebKitGTK
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Uji inti
        working-directory: native/linux
        run: cargo test --locked

      - name: Bangun jendela GTK
        working-directory: native/linux
        run: cargo build --locked --features ui
